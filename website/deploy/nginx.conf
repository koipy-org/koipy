server {
    listen 80;
    listen [::]:80;
    server_name docs.example.com;   # 改成你的域名

    root /var/www/koipy-docs;
    index index.html;

    charset utf-8;

    # VitePress 开了 cleanUrls：/foo 对应 /foo.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    # 带 hash 的静态资源可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML 不缓存，保证更新即时可见
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
